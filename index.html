<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fundo Prototype B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: ledger-style guide on the left, one working phone on the right. Palette is paper, graphite and a single lime highlighter. Under 900px the guide hides; under 520px the phone fills the screen. */
:root{
  --paper:#F5F6F1; --card:#FFFFFF; --ink:#15171A; --lime:#CDEB5B; --lime2:#E6F4AE; --stone:#E1E3DA; --muted:#656A62; --alert:#C8401F;
  --stage:#E7E9E0; --stage-ink:#15171A; --stage-muted:#5B6058; --panel:#F8F9F4; --panel-line:#CFD3C6;
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#101210;--stage-ink:#F2F4EA;--stage-muted:#A8AD9F;--panel:#1A1D19;--panel-line:#2E332B;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#101210;--stage-ink:#F2F4EA;--stage-muted:#A8AD9F;--panel:#1A1D19;--panel-line:#2E332B;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--stage-ink);font-family:var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--alert);outline-offset:2px}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:72px;padding-block:20px}
.guide{width:340px;flex-shrink:0;min-width:0}
.g-top{display:flex;align-items:center;justify-content:space-between}
.g-top .tag{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;background:var(--lime);color:#15171A;border-radius:4px}
.guide h1{font:700 36px/1.04 var(--display);font-stretch:116%;letter-spacing:-.025em;margin:26px 0 10px;text-wrap:balance}
.guide p{margin:0;color:var(--stage-muted);font-size:15px;line-height:1.5}
.g-pal{display:flex;margin-top:16px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--panel-line)}
.g-pal i{flex:1;height:30px}
.flows{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--panel-line)}
.gi{width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:12px 4px;background:none;border:0;border-bottom:1px solid var(--panel-line);cursor:pointer;transition:padding .2s,background .2s}
.gi:hover{background:var(--panel);padding-left:12px}
.gi .gn{font:500 12px var(--mono);color:var(--stage-muted);width:22px}
.gi b{display:block;font-size:15px;font-weight:600}
.gi small{display:block;font-size:13px;color:var(--stage-muted);margin-top:1px}
.gi .ga{margin-left:auto;color:var(--stage-muted)}
.g-ctl{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.g-btn{height:44px;padding:0 18px;border-radius:8px;border:1.5px solid var(--stage-ink);background:transparent;font-weight:600;font-size:14px;cursor:pointer}
.g-btn:hover{background:var(--lime);border-color:var(--lime);color:#15171A}
.g-tog{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;cursor:pointer;min-height:44px}
.g-tog input{width:18px;height:18px;accent-color:#15171A}
.phone-wrap{position:relative;flex-shrink:0;margin:12px}
.phone{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;border-radius:38px;overflow:hidden;overflow:clip;background:var(--paper);color:var(--ink);box-shadow:0 0 0 9px #15171A,0 50px 90px -34px rgba(21,23,26,.55);isolation:isolate;font-family:var(--body)}
body.mobile .phone{border-radius:0;box-shadow:none}
body.mobile .phone-wrap{margin:0}
body.mobile .stage{padding:0;gap:0;align-items:flex-start;background:#F5F6F1}
body.mobile{background:#F5F6F1;padding-left:0;padding-right:0}
@media (max-width:900px){.guide{display:none}}

/* ---------- phone internals ---------- */
.screen{position:absolute;inset:0;background:var(--paper);overflow:hidden;overflow:clip;clip-path:polygon(0 0,140% 0,100% 100%,-40% 100%);transition:clip-path .6s cubic-bezier(.7,0,.2,1),transform .5s cubic-bezier(.22,.9,.28,1),opacity .35s ease,visibility 0s}
.screen:not([data-s=active]){visibility:hidden;transition:clip-path .6s cubic-bezier(.7,0,.2,1),transform .5s cubic-bezier(.22,.9,.28,1),opacity .35s ease,visibility 0s .55s}
.screen[data-s=right]{clip-path:polygon(-40% 0,-40% 0,-40% 100%,-40% 100%)}
.screen[data-s=behind]{transform:translateX(-5%)}
.screen[data-s=rise]{transform:translateY(10px);opacity:0}
.screen[data-s=hidden]{opacity:0}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:22px 22px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.fill{position:absolute;inset:0;display:flex;flex-direction:column;padding:24px 22px 28px}
.d{font-family:var(--display);font-stretch:118%;font-weight:700;letter-spacing:-.025em}
.lab{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mut{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.rise{animation:rise .55s cubic-bezier(.22,.9,.28,1) both;animation-delay:calc(var(--i,0)*50ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spinb{0%,100%{transform:scaleY(.45);opacity:.5}50%{transform:scaleY(1);opacity:1}}
.spin{display:inline-flex;align-items:center;gap:3px;height:18px}
.spin i{display:block;width:4px;height:18px;border-radius:1px;background:currentColor;animation:spinb .8s ease-in-out infinite}
.spin i:nth-child(2){animation-delay:.12s}.spin i:nth-child(3){animation-delay:.24s}
.hl{background:linear-gradient(transparent 58%,var(--lime) 58%,var(--lime) 92%,transparent 92%);padding:0 3px;margin:0 -3px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:60px;padding:0 10px 0 20px;border:0;border-radius:12px;font:600 16px var(--body);font-stretch:108%;text-align:left;cursor:pointer;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.85;cursor:default}
.btn .ar{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.btn:hover:not(:disabled) .ar{transform:translateX(3px)}
.btn.ink{background:var(--ink);color:var(--paper)}.btn.ink .ar{background:var(--lime);color:var(--ink)}
.btn.lime{background:var(--lime);color:var(--ink)}.btn.lime .ar{background:var(--ink);color:var(--lime)}
.btn.line{background:transparent;border:1.5px solid var(--ink);color:var(--ink);padding-right:9px}.btn.line .ar{background:var(--ink);color:var(--paper)}
.lnk{border:0;background:none;padding:0;min-height:44px;font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--lime);text-decoration-thickness:4px;text-underline-offset:3px}
.cta{position:absolute;left:22px;right:22px;bottom:26px;z-index:5}

/* surfaces */
.box{background:var(--card);border:1px solid var(--stone);border-radius:14px}
.top{display:flex;align-items:center;gap:14px}
.top h1{margin:0;font-size:26px;line-height:1.05}
.bk{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--stone);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:transform .12s,border-color .2s}
.bk:hover{border-color:var(--ink)}
.bk:active{transform:scale(.94)}
.in{width:100%;height:54px;border-radius:10px;border:1.5px solid var(--stone);background:var(--card);padding:0 16px;font:500 16px var(--body);color:var(--ink);transition:border-color .2s,box-shadow .2s}
.in::placeholder{color:#7A7F76}
.in:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--lime)}
.fld{display:flex;flex-direction:column;gap:7px}
.sw{position:relative;width:56px;height:44px;flex-shrink:0;background:none;border:0;padding:0;cursor:pointer}
.sw::before{content:"";position:absolute;left:2px;top:7px;width:52px;height:30px;border-radius:8px;background:var(--stone);transition:background .25s}
.sw i{position:absolute;left:6px;top:11px;width:22px;height:22px;border-radius:5px;background:var(--card);box-shadow:0 0 0 1.5px var(--ink);transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .25s}
.sw.on::before{background:var(--ink)}
.sw.on i{transform:translateX(22px);background:var(--lime);box-shadow:none}
.chk{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--stone);display:grid;place-items:center;color:transparent;flex-shrink:0;transition:all .25s}
.opt{width:100%;display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--stone);background:var(--card);text-align:left;cursor:pointer;transition:border-color .2s,transform .12s}
.opt:active{transform:scale(.99)}
.opt .oi{width:40px;height:40px;border-radius:8px;background:var(--paper);display:grid;place-items:center;flex-shrink:0}
.opt b{flex:1;font-size:16px;font-weight:600}
.opt.sel{border-color:var(--ink)}
.opt.sel .oi{background:var(--lime)}
.opt.sel .chk{background:var(--lime);border-color:var(--ink);color:var(--ink)}
.sgc{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.sg{height:44px;border:0;background:var(--card);font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:background .25s,color .25s}
.sg+.sg{border-left:1.5px solid var(--ink)}
.sg[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg{display:flex;gap:3px}
.seg i{flex:1;height:16px;border-radius:2px;background:var(--stone);transition:background .3s}
.seg i.f{background:var(--ink)}
.seg i.cur{background:var(--lime);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tag2{display:inline-block;padding:4px 8px;border-radius:4px;background:var(--lime);font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.tag2.o{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.ic2{width:36px;height:36px;border-radius:8px;background:var(--lime);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}

/* tab bar: text only, highlighter under the active label */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:80px;padding:0 14px 18px;background:var(--paper);border-top:1px solid var(--stone);display:flex;z-index:20;transition:transform .5s cubic-bezier(.22,.9,.28,1)}
.tabbar.off{transform:translateY(110%)}
.tab{flex:1;border:0;background:none;font:500 12px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:color .2s}
.tab span{position:relative;display:inline-block;isolation:isolate;padding:2px 0}
.tab span::before{content:"";position:absolute;left:-5px;right:-5px;bottom:0;height:10px;background:var(--lime);z-index:-1;transform:scaleX(0);transform-origin:0 50%;transition:transform .4s cubic-bezier(.3,1.1,.5,1)}
.tab.on{color:var(--ink)}
.tab.on span::before{transform:scaleX(1)}
.dotb{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--lime);color:var(--ink);font:500 11px/20px var(--mono);text-align:center;box-shadow:0 0 0 2px var(--paper)}

/* overlays */
.scrim{position:absolute;inset:0;background:rgba(21,23,26,.42);opacity:0;pointer-events:none;transition:opacity .35s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:55;background:var(--paper);border-radius:18px 18px 0 0;padding:0 22px 28px;transform:translateY(105%);transition:transform .5s cubic-bezier(.22,.9,.28,1);max-height:90%;overflow-y:auto;scrollbar-width:none}
.sheet.on{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;border-bottom:1px solid var(--stone);margin-bottom:16px;position:sticky;top:0;background:var(--paper)}
.sh b{font:700 20px var(--display);font-stretch:116%;letter-spacing:-.02em}
.sh .x{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--stone);background:var(--card);display:grid;place-items:center;cursor:pointer}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:60;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px 10px 10px;font:500 14px/1.35 var(--body);display:flex;gap:12px;align-items:center;transform:translateY(20px);opacity:0;pointer-events:none;transition:transform .4s cubic-bezier(.22,.9,.28,1),opacity .3s}
.toast.on{transform:none;opacity:1}
.toast .ti2{width:30px;height:30px;border-radius:6px;background:var(--lime);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.banner{position:absolute;left:10px;right:10px;top:10px;z-index:70;display:flex;gap:12px;align-items:center;text-align:left;border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 14px 10px 10px;transform:translateY(-150%);transition:transform .55s cubic-bezier(.3,1.2,.5,1);cursor:pointer}
.banner.on{transform:none}
.banner .bi{width:40px;height:40px;border-radius:8px;background:var(--lime);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.banner i{display:block;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--lime);font-style:normal}
.banner b{display:block;font-size:14px;margin-top:1px}
.banner small{display:block;font-size:13px;color:#B9BEB1;margin-top:1px}

/* home */
.stamp{width:60px;height:64px;border-radius:8px;background:var(--lime);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.stamp i{font:500 11px var(--mono);letter-spacing:.1em;font-style:normal}
.stamp b{font:700 28px/1 var(--display);font-stretch:112%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t2{position:relative;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--stone);background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:118px;transition:transform .15s,border-color .2s}
.t2:hover{border-color:var(--ink)}
.t2:active{transform:scale(.97)}
.t2 b{display:block;font-size:15px;font-weight:700}
.t2 small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.t2 .go{position:absolute;top:14px;right:14px;color:var(--muted)}
.lr{display:flex;justify-content:space-between;gap:10px}
.lr b{display:block;font-size:16px;font-weight:700}
.lr small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.lr .r{text-align:right}

/* ledger */
.lg{background:var(--card);border:1px solid var(--stone);border-radius:14px;overflow:hidden}
.lrow{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--stone);background:var(--card);text-align:left;cursor:pointer;transition:background .2s}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--paper)}
.lrow .dt{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.lrow b{display:block;font-size:15px;font-weight:600}
.lrow small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.lrow .am{font:600 15px var(--body);font-stretch:108%;text-align:right}
.lrow .am.in2{background:var(--lime);padding:2px 6px;border-radius:3px}
.krow{display:flex;justify-content:space-between;gap:14px;min-height:50px;align-items:center;font-size:14px;border-top:1px solid var(--stone)}
.krow span{color:var(--muted)}
.krow b{text-align:right}

/* slider */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;cursor:pointer;margin:0}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:2px;background:linear-gradient(to right,var(--ink) var(--p,0%),var(--stone) var(--p,0%))}
.rng::-moz-range-track{height:8px;border-radius:2px;background:var(--stone)}
.rng::-moz-range-progress{height:8px;border-radius:2px;background:var(--ink)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:8px;background:var(--lime);border:2px solid var(--ink)}
.rng::-moz-range-thumb{width:26px;height:26px;border-radius:8px;background:var(--lime);border:2px solid var(--ink)}

/* fingerprint pad */
.pad{position:relative;width:176px;height:176px;border:0;padding:0;background:var(--card);border-radius:22px;display:grid;place-items:center;cursor:pointer;color:var(--ink);overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--stone)}
.pad .up{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--lime);transition:height 1.4s cubic-bezier(.4,0,.2,1)}
.pad.scanning .up,.pad.done .up{height:100%}
.pad.done .up{transition:none}
.pad .ficon{position:relative;z-index:2;display:grid;place-items:center}
.pad .scan{position:absolute;left:16px;right:16px;top:16px;height:2px;background:var(--ink);opacity:0;z-index:3}
.pad.scanning .scan{opacity:1;animation:scanv 1.4s ease-in-out infinite alternate}
@keyframes scanv{from{top:16px}to{top:156px}}
.pad .br{position:absolute;width:24px;height:24px;border:3px solid var(--ink);z-index:3;animation:brk 2.2s ease-in-out infinite}
.pad .br.a{left:10px;top:10px;border-right:0;border-bottom:0;border-top-left-radius:8px}
.pad .br.b{right:10px;top:10px;border-left:0;border-bottom:0;border-top-right-radius:8px}
.pad .br.c{left:10px;bottom:10px;border-right:0;border-top:0;border-bottom-left-radius:8px}
.pad .br.d{right:10px;bottom:10px;border-left:0;border-top:0;border-bottom-right-radius:8px}
@keyframes brk{0%,100%{transform:scale(1)}50%{transform:scale(.88)}}
.pad.done .ficon{animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* splash */
.splash{display:grid;place-items:center;background:var(--paper)!important}
.splash .lw{display:flex;flex-direction:column;align-items:center;gap:34px}
.splash .wmk path,.splash .wmk circle.s4{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .8s cubic-bezier(.5,0,.2,1) both}
.splash .wmk .s1{animation-delay:.2s}.splash .wmk .s2{animation-delay:.45s}.splash .wmk .s3{animation-delay:.7s}.splash .wmk .s4{animation-delay:.95s}
.splash .wmk .co{transform-box:fill-box;transform-origin:50% 50%;animation:coin .6s cubic-bezier(.3,1.5,.5,1) 1.6s both}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes coin{from{transform:translateY(-30px) scale(.2);opacity:0}to{transform:none;opacity:1}}
.splash .ld{display:flex;gap:3px;width:200px}
.splash .ld i{flex:1;height:10px;border-radius:2px;background:var(--stone);animation:segon .01s calc(1.1s + var(--n)*45ms) both}
@keyframes segon{to{background:var(--ink)}}
.splash .sub{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);animation:rise .6s 1.9s both}

/* success */
.ok{background:var(--lime)!important}
.burst{position:absolute;left:50%;top:150px;width:0;height:0;z-index:3;pointer-events:none}
.burst i{position:absolute;left:0;top:0;opacity:0;animation:fly 1.2s cubic-bezier(.15,.8,.3,1) both}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.okc{width:96px;height:96px;border-radius:22px;background:var(--ink);color:var(--lime);display:grid;place-items:center;animation:pop .55s cubic-bezier(.3,1.4,.5,1) both}
.rcp{border-radius:14px;background:var(--card);padding:4px 18px;color:var(--ink)}
.rcp div{display:flex;justify-content:space-between;gap:14px;align-items:center;min-height:50px;font-size:14px}
.rcp div+div{border-top:1px dashed #C9CDBF}
.rcp span{color:var(--muted)}
.rcp b{text-align:right}

/* otp + previews */
.otp{display:flex;gap:8px;margin:18px 0 14px}
.otp span{flex:1;height:58px;border-radius:10px;border:1.5px solid var(--stone);background:var(--card);display:grid;place-items:center;font:700 24px var(--display)}
.otp span.f{border-color:var(--ink);animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.otpst{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;min-height:28px;color:var(--muted)}
.sms{background:#E9E9EC;border-radius:16px;padding:16px;margin:0 0 18px}
.sms small{display:block;text-align:center;color:#5C5C63;font-size:12px;margin-bottom:10px}
.sms p{margin:0;background:#fff;color:#1d1d20;border-radius:14px 14px 14px 4px;padding:12px 14px;font-size:15px;line-height:1.4;animation:rise .5s .2s both}
.ev{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:12px;background:var(--card);border:1px solid var(--stone);margin:0 0 18px}
.ev strong{display:block;font-size:16px}
.ev small{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}

/* hints */
.hints-on [data-hint]{position:relative}
.hints-on [data-hint]::after{content:"";position:absolute;inset:-6px;border-radius:inherit;border:2.5px solid var(--alert);pointer-events:none;animation:hint 1.5s ease-out infinite;z-index:9}
@keyframes hint{0%{transform:scale(.97);opacity:.95}100%{transform:scale(1.05);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .rise,.pad .br,.splash *{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}
  .screen,.sheet,.toast,.banner,.tabbar,.seg i,.pad .up{transition-duration:.01ms!important}
}
